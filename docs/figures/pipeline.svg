<svg viewBox="0 0 1064 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Anonymization pipeline, file to public AI</title>
  <desc id="pipeline-desc">A company file is read, turned into Markdown, scanned for identifiers and rewritten on the local machine, then reviewed before anything is pasted into a public AI model; each step is marked with the research question that measures it.</desc>
  <style>
    text{font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif}
    .mono{font-family:'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace}
    .connector{fill:none;stroke:#4f5d75;stroke-width:1}
    .connector.optional{stroke-dasharray:5,4}
    .node-mask{fill:#f5f5f5}
    .node{fill:#ffffff;stroke:#2d3142;stroke-opacity:.55}
    .node.focal{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-opacity:1;stroke-width:1.2}
    .node.input{fill:rgba(79,93,117,.10);stroke:#5a6580;stroke-opacity:1}
    .node.optional{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.35);stroke-opacity:1;stroke-dasharray:4,3}
    .node.external{fill:rgba(45,49,66,.03);stroke:rgba(45,49,66,.30);stroke-opacity:1}
    .role{fill:rgba(45,49,66,.10)}
    .role.focal{fill:rgba(191,69,32,.25)}
    .role-text{fill:#2d3142;font-size:6px;font-weight:600}
    .role-text.focal{fill:#bf4520}
    .node-title{fill:#2d3142;font-size:9.5px;font-weight:600}
    .node-sub{fill:#4f5d75;font-size:6.5px}
    .node-tool{fill:#5a6580;font-size:6.5px}
    .boundary{fill:none;stroke:rgba(45,49,66,.30);stroke-dasharray:4,4}
    .boundary-label{fill:#4f5d75;font-size:7px;font-weight:500;letter-spacing:.12em}
    .rq{fill:#4f5d75;font-size:7px;font-weight:500;letter-spacing:.08em}
    .legend-key{fill:#4f5d75;font-size:7px;font-weight:500;letter-spacing:.12em}
    .legend-text{fill:#4f5d75;font-size:8px}
  </style>
  <defs>
    <pattern id="pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,.10)"/></pattern>
    <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="1064" height="292" fill="#f5f5f5"/>
  <rect width="1064" height="292" fill="url(#pipeline-dots)" opacity=".55"/>

  <!-- Local boundary: everything inside stays on the machine -->
  <rect class="boundary" x="12" y="12" width="896" height="200" rx="6"/>
  <text class="boundary-label mono" x="24" y="30">ON THE MACHINE · NOTHING IS SENT</text>

  <!-- Connectors, drawn before nodes -->
  <line class="connector" x1="128" y1="164" x2="174" y2="164" marker-end="url(#pipeline-arrow)"/>
  <line class="connector" x1="280" y1="164" x2="326" y2="164" marker-end="url(#pipeline-arrow)"/>
  <line class="connector" x1="432" y1="164" x2="478" y2="164" marker-end="url(#pipeline-arrow)"/>
  <line class="connector" x1="584" y1="164" x2="630" y2="164" marker-end="url(#pipeline-arrow)"/>
  <line class="connector" x1="736" y1="164" x2="782" y2="164" marker-end="url(#pipeline-arrow)"/>
  <line class="connector" x1="888" y1="164" x2="934" y2="164" marker-end="url(#pipeline-arrow)"/>
  <path class="connector optional" d="M532 132 V76 Q532 68 540 68 H554" marker-end="url(#pipeline-arrow)"/>
  <path class="connector optional" d="M660 68 H676 Q684 68 684 76 V130" marker-end="url(#pipeline-arrow)"/>

  <g text-anchor="middle">
    <!-- 1 input file -->
    <rect class="node-mask" x="24" y="132" width="104" height="64" rx="6"/>
    <rect class="node input" x="24" y="132" width="104" height="64" rx="6"/>
    <rect class="role" x="28" y="136" width="20" height="10" rx="2"/><text class="role-text mono" x="38" y="143">IN</text>
    <text class="node-title" x="76" y="164">Company file</text>
    <text class="node-sub mono" x="76" y="178">DOCX XLSX PPTX PDF</text>
    <text class="node-tool mono" x="76" y="188">CSV TXT images</text>

    <!-- 2 extract -->
    <rect class="node-mask" x="176" y="132" width="104" height="64" rx="6"/>
    <rect class="node" x="176" y="132" width="104" height="64" rx="6"/>
    <rect class="role" x="180" y="136" width="24" height="10" rx="2"/><text class="role-text mono" x="192" y="143">READ</text>
    <text class="node-title" x="228" y="164">Extract text</text>
    <text class="node-sub mono" x="228" y="178">body, hidden parts, OCR</text>
    <text class="node-tool mono" x="228" y="188">pipeline/</text>

    <!-- 3 markdown -->
    <rect class="node-mask" x="328" y="132" width="104" height="64" rx="6"/>
    <rect class="node" x="328" y="132" width="104" height="64" rx="6"/>
    <rect class="role" x="332" y="136" width="20" height="10" rx="2"/><text class="role-text mono" x="342" y="143">MD</text>
    <text class="node-title" x="380" y="164">Markdown</text>
    <text class="node-sub mono" x="380" y="178">one text per file</text>
    <text class="node-tool mono" x="380" y="188">pipeline/</text>

    <!-- 4 detect (focal) -->
    <rect class="node-mask" x="480" y="132" width="104" height="64" rx="6"/>
    <rect class="node focal" x="480" y="132" width="104" height="64" rx="6"/>
    <rect class="role focal" x="484" y="136" width="20" height="10" rx="2"/><text class="role-text focal mono" x="494" y="143">FIND</text>
    <text class="node-title" x="532" y="164">Find identifiers</text>
    <text class="node-sub mono" x="532" y="178">combined: rules + GLiNER</text>
    <text class="node-tool mono" x="532" y="188">detect/</text>

    <!-- optional local LLM final pass -->
    <rect class="node-mask" x="556" y="44" width="104" height="48" rx="6"/>
    <rect class="node optional" x="556" y="44" width="104" height="48" rx="6"/>
    <text class="node-title" x="608" y="64">Local LLM pass</text>
    <text class="node-sub mono" x="608" y="78">Qwen or Gemma, optional</text>

    <!-- 5 replace -->
    <rect class="node-mask" x="632" y="132" width="104" height="64" rx="6"/>
    <rect class="node" x="632" y="132" width="104" height="64" rx="6"/>
    <rect class="role" x="636" y="136" width="20" height="10" rx="2"/><text class="role-text mono" x="646" y="143">SWAP</text>
    <text class="node-title" x="684" y="164">Replace</text>
    <text class="node-sub mono" x="684" y="178">[PERSON] or [PERSON_1]</text>
    <text class="node-tool mono" x="684" y="188">redact/</text>

    <!-- 6 review -->
    <rect class="node-mask" x="784" y="132" width="104" height="64" rx="6"/>
    <rect class="node" x="784" y="132" width="104" height="64" rx="6"/>
    <rect class="role" x="788" y="136" width="20" height="10" rx="2"/><text class="role-text mono" x="798" y="143">YOU</text>
    <text class="node-title" x="836" y="164">Review output</text>
    <text class="node-sub mono" x="836" y="178">misses, metadata,</text>
    <text class="node-tool mono" x="836" y="188">business secrets</text>

    <!-- 7 public AI (external) -->
    <rect class="node-mask" x="936" y="132" width="104" height="64" rx="6"/>
    <rect class="node external" x="936" y="132" width="104" height="64" rx="6"/>
    <rect class="role" x="940" y="136" width="20" height="10" rx="2"/><text class="role-text mono" x="950" y="143">OUT</text>
    <text class="node-title" x="988" y="164">Public AI</text>
    <text class="node-sub mono" x="988" y="178">e.g. ChatGPT Free</text>
    <text class="node-tool mono" x="988" y="188">data leaves here</text>

    <!-- research question measured at each step -->
    <text class="rq mono" x="76" y="232">RQ1 FORMATS</text>
    <text class="rq mono" x="228" y="232">RQ2 EXTRACTION</text>
    <text class="rq mono" x="532" y="232">RQ2 DETECTION</text>
    <text class="rq mono" x="684" y="232">RQ4 USEFULNESS</text>
    <text class="rq mono" x="988" y="232">RQ3 RE-IDENTIFICATION</text>
  </g>

  <!-- Legend strip -->
  <line x1="24" y1="252" x2="1040" y2="252" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
  <text class="legend-key mono" x="24" y="274">KEY</text>
  <rect x="64" y="266" width="16" height="10" rx="2" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1"/>
  <text class="legend-text" x="86" y="274">Main detector</text>
  <rect x="172" y="266" width="16" height="10" rx="2" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.35)" stroke-dasharray="4,3"/>
  <text class="legend-text" x="194" y="274">Optional step</text>
  <rect x="280" y="266" width="16" height="10" rx="2" fill="none" stroke="rgba(45,49,66,.30)" stroke-dasharray="4,4"/>
  <text class="legend-text" x="302" y="274">Local boundary</text>
  <text class="legend-text" x="400" y="274">RQ labels show which research question measures each step</text>
</svg>
